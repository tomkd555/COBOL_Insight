appId: jp.cobolinsight.gui
productName: COBOL Insight
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm
# The jpackage app-image (engine plus its bundled JRE) ships inside the archive. It is read from
# release/engine, where `gradlew :engine:app:jpackageAppImage` puts it; build it first, otherwise
# packaging fails here.
extraResources:
  - from: ../../release/engine/COBOLInsight
    to: engine
    filter:
      - "**/*"
directories:
  output: ../../release
win:
  target: dir
  signAndEditExecutable: false
afterAllArtifactBuild: ./scripts/stage-release.cjs
