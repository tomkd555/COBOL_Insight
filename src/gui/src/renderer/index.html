<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      The CSP is what enforces "no network, no CDN". default-src 'self' cuts off every external host,
      font and script and permits only the locally bundled assets. No external origin is added.

      script-src states 'self' and so forbids inline scripts.
      style-src needs 'unsafe-inline' for Monaco: it positions every line with a style attribute
      (style="top:NNpx"), and without it style-src-attr falls back to 'self', every line lands at the
      same y coordinate, and the source on screen no longer matches the file.
      worker-src's blob: is needed only to start Monaco's worker, which is raised from a Blob holding
      the already-bundled worker code.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COBOL Insight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
