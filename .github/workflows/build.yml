name: build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/gui/package-lock.json
      - name: Engine build and tests
        run: .\gradlew.bat build --no-daemon --stacktrace
      - name: GUI install
        run: npm ci
        working-directory: src/gui
      - name: GUI type check and tests
        run: |
          npm run typecheck
          npm test
        working-directory: src/gui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            src/build/**/reports/**
            src/engine/**/build/reports/**
